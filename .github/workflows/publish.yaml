name: publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
      - name: Inject development version into mainpage.dox
        run: |
          VERSION=$(sed -n 's/^project(log-it-cpp VERSION \([^ ]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ -z "$VERSION" ]; then
            if VERSION=$(git describe --tags --abbrev=0 2>/dev/null); then
              VERSION=$(printf '%s' "$VERSION" | sed 's/^v//')
            else
              VERSION="0.0.0-untagged"
            fi
          fi
          DOC_VERSION="${VERSION}-dev"
          echo "Using version: $DOC_VERSION"
          echo "DOC_VERSION=$DOC_VERSION" >> "$GITHUB_ENV"
          test -f docs/mainpage.dox || { echo "mainpage.dox not found!"; exit 1; }
          sed -i "0,/VERSION_PLACEHOLDER/s//${DOC_VERSION}/" docs/mainpage.dox
      - name: Generate Documentation
        uses: mattnotmitt/doxygen-action@v1.12.0
      - name: Validate generated documentation
        run: |
          test -s docs/html/index.html
          test -s docs/html/pages.html
          test -s docs/html/classes.html
          test -s docs/html/quickstart.html
          test -s docs/html/backends.html
          test -s docs/html/benchmarks.html
          test -s docs/html/comparison.html
          test -s docs/html/api_reference.html
          grep -q "$DOC_VERSION" docs/html/index.html
          grep -q "Quick start" docs/html/index.html
          grep -q "Backend matrix" docs/html/index.html
          grep -q "Performance and benchmarks" docs/html/index.html
          grep -q "Comparison with other C++ logging libraries" docs/html/index.html
          grep -q "API reference and concepts" docs/html/index.html
          grep -R -q "MemoryLogger" docs/html
          grep -R -q "MdbxLogger" docs/html
          grep -R -q "PrometheusHttpServerLogger" docs/html
          grep -R -q "OtlpHttpLogger" docs/html
          ! grep -R -q "AGENTS.md" docs/html
          ! grep -R -q "NewYaroslav" docs/html
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          root = Path("docs/html")
          missing = []
          for page in root.glob("*.html"):
              text = page.read_text(encoding="utf-8", errors="ignore")
              for href in re.findall(r'href="([^"]+)"', text):
                  parsed = urlsplit(href)
                  target = parsed.path
                  if not target or parsed.scheme or href.startswith("#"):
                      continue
                  target = target.split("#", 1)[0]
                  if target and not (page.parent / target).exists():
                      missing.append(f"{page}: {href}")
          if missing:
              print("Broken local documentation links:")
              print("\n".join(missing))
              raise SystemExit(1)
          PY
      - name: Install browser for documentation layout smoke test
        run: |
          PLAYWRIGHT_DIR="$RUNNER_TEMP/logit-doc-layout"
          npm install --prefix "$PLAYWRIGHT_DIR" --no-save playwright@1.55.0
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_DIR=$PLAYWRIGHT_DIR" >> "$GITHUB_ENV"
      - name: Verify documentation layout
        run: |
          python3 -m http.server 8765 --directory docs/html > "$RUNNER_TEMP/docs-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 1
          NODE_PATH="$PLAYWRIGHT_DIR/node_modules" node .github/scripts/docs-layout-smoke.cjs
      - name: Publish generated content to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: docs/html
          publish_branch: gh-pages
